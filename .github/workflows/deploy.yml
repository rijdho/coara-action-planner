name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's own 600000 ms default is how long it waits for GitHub to
          # finish publishing before giving up AND cancelling the deployment. On
          # 2026-08-06 three deploys in a row were cancelled that way while Pages
          # was still reporting deployment_in_progress — the build takes ~25s and
          # the artifact is ~1.1 MB, so this is queue latency on GitHub's side, not
          # anything this repo controls. Waiting longer costs nothing when Pages is
          # quick; giving up early costs a deploy.
          timeout: 1800000
