<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>" />
    <title>CoARA Action Planner</title>
    <meta name="description" content="Self-assess your institution against the ten CoARA commitments and generate a prioritised, editable research-assessment reform action plan — entirely in your browser. Open source." />

    <!--
      Link previews. The app is client-rendered, so a crawler that does not run JS
      (LinkedIn, Slack, Mastodon, Bluesky) sees only this head — without og:image a
      shared link is a bare text row. The card is generated by docs/og-card.mjs;
      regenerate it whenever docs/maturity-profile.png changes. Absolute URLs are
      required here: crawlers do not resolve relative ones.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CoARA Action Planner" />
    <meta property="og:title" content="CoARA Action Planner" />
    <meta property="og:description" content="Self-assess against the ten CoARA commitments and draft a prioritised action plan — in your browser." />
    <meta property="og:url" content="https://rijdho.github.io/coara-action-planner/" />
    <meta property="og:image" content="https://rijdho.github.io/coara-action-planner/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CoARA Action Planner — a maturity radar across the ten CoARA commitments, next to the tool's name." />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="es" />
    <meta property="og:locale:alternate" content="fr" />
    <meta property="og:locale:alternate" content="de" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CoARA Action Planner" />
    <meta name="twitter:description" content="Self-assess against the ten CoARA commitments and draft a prioritised action plan — in your browser." />
    <meta name="twitter:image" content="https://rijdho.github.io/coara-action-planner/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
